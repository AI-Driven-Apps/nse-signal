services:
  backstage:
    build: .
    container_name: backstage-trader
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/data          # SQLite DB persists here — back this folder up
    ports:
      - "8000:8000"           # dashboard — LAN only, do not forward on your router
    mem_limit: 512m           # keep the Pi responsive for your YT pipeline
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
