<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}nse-signal{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0;
           background: canvas; color: canvastext; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 0.75rem 1.25rem; border-bottom: 1px solid #8884; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { padding: 1.25rem; max-width: 1000px; margin: 0 auto; }
    footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; opacity: 0.6; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
             gap: 0.75rem; margin-bottom: 1.5rem; }
    .card { border: 1px solid #8884; border-radius: 10px; padding: 1rem; }
    .card .label { font-size: 0.75rem; opacity: 0.65; text-transform: uppercase; }
    .card .value { font-size: 1.4rem; font-weight: 700; margin-top: 0.25rem; }
    .pos { color: #2ECC71; } .neg { color: #E74C3C; }
    .badge { display: inline-block; padding: 0.35rem 0.9rem; border-radius: 999px;
             font-weight: 700; font-size: 0.85rem; }
    .badge-fear { background: #E74C3C22; color: #E74C3C; }
    .badge-neutral { background: #95A5A622; color: #7f8c8d; }
    .badge-greed { background: #2ECC7122; color: #2ECC71; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #8882; }
    .movers { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 1.5rem 0; }
    .err { color: #E74C3C; font-size: 0.85rem; }
    .ok { color: #2ECC71; font-size: 0.85rem; }
    input, select { display: block; width: 100%; box-sizing: border-box; padding: 0.5rem;
            margin: 0.4rem 0 1rem; }
    button { padding: 0.5rem 1.25rem; cursor: pointer; }
    nav { display: flex; gap: 1rem; }
    nav a { color: inherit; opacity: 0.7; text-decoration: none; font-size: 0.9rem; }
    nav a.active { opacity: 1; font-weight: 700; text-decoration: underline; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tabs a { padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid #8884;
              color: inherit; text-decoration: none; font-size: 0.85rem; }
    .tabs a.active { background: #8882; font-weight: 700; }
    .muted { opacity: 0.65; font-size: 0.85rem; }
    .row-actions form { display: inline; }
    .star { cursor: pointer; background: none; border: none; font-size: 1rem; padding: 0; }
  </style>
</head>
<body>
  <header>
    <a href="/">nse-signal</a>
    {% if user %}
    <nav>
      <a href="/">Overview</a>
      <a href="/stats">Stats</a>
      <a href="/strategy">Strategy</a>
      <a href="/watchlist">Watchlist</a>
      <a href="/signals">Signals</a>
      <a href="/logout">Log out</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Paper trading &middot; not financial advice</footer>
</body>
</html>
